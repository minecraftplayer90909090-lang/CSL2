name: CS Launcher Plus CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Rebrand ke time sirf yahi naam badalna
  APP_NAME: CS Launcher Plus

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_NEXT_KEYSTORE_PASSWORD }}
      CSPUB_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_NEXT_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check project layout
        run: |
          ls
          if [ ! -d app_cs ]; then
            echo "::error::app_cs folder nahi mila. Ye workflow asli CS Launcher repo ke liye hai (jisme app_cs aur scripts/ hon)."
            exit 1
          fi
          ls scripts || true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_cs/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: app_cs/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create out directory
        run: mkdir out

      - name: Fetch Virtual LAN tunnel engine (EasyTier)
        run: bash scripts/fetch_easytier.sh

      - name: Build Virtual LAN VPN bridge (hev-socks5-tunnel)
        run: bash scripts/build_hev_tunnel.sh

      - name: Fetch Horizon engine
        run: bash scripts/fetch_horizon_engine.sh

      - name: Build Debug .apk
        run: |
          gradle :app_cs:assembleFullDebug --console=plain
          mv app_cs/build/outputs/apk/full/debug/app_cs-full-debug.apk out/app-debug-full.apk

      - name: Build Debug .apk (No runtime)
        run: |
          gradle :app_cs:assembleNoruntimeDebug --console=plain
          mv app_cs/build/outputs/apk/noruntime/debug/app_cs-noruntime-debug.apk out/app-debug-noruntime.apk

      - name: Gen md5sums
        run: |
          md5sum out/app-debug-full.apk > out/app-debug-full.md5
          md5sum out/app-debug-noruntime.apk > out/app-debug-noruntime.md5

      - name: Decode release keystores (only if secrets configured)
        if: env.CSPUB_KEYSTORE_PASSWORD != ''
        run: |
          if [ -n "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app_cs/cs_upload_next.jks
          fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app_cs/cs_release_next.jks
          fi

      - name: Build Release .apk (signed, optional)
        if: env.CSPUB_KEYSTORE_PASSWORD != ''
        run: |
          gradle :app_cs:assembleFullPubRelease --console=plain
          mv app_cs/build/outputs/apk/full/pubRelease/app_cs-full-pubRelease.apk out/CS-Launcher-Plus-release.apk
          md5sum out/CS-Launcher-Plus-release.apk > out/CS-Launcher-Plus-release.md5

      - name: Release notes + in-app update metadata
        run: |
          VERSION_NAME=$(grep -oP 'versionName "\K[^"]+' app_cs/build.gradle | head -1)
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          {
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "## ${APP_NAME} ${GITHUB_REF_NAME}"
              echo ""
              echo "Release build of ${GITHUB_SHA}."
            else
              echo "## ${APP_NAME} ${VERSION_NAME} - build ${GITHUB_RUN_NUMBER}"
              echo ""
              echo "Automated build of ${GITHUB_SHA} (${GITHUB_REF_NAME}), published by GitHub Actions."
            fi
            echo "**app-debug-full.apk** is the one to install (includes the Java runtime)."
            echo ""
            echo "### What's new"
            git log -15 --no-merges --pretty=format:'- %s' | sed -E 's/^- (Fix|Feat|Upd)\[([^]]*)\]: ?/- **\2:** /' || true
            echo ""
            echo ""
            echo "<!-- cs-update-begin (read by the launcher's update checker, do not edit) -->"
            echo "cs-update: versionCode=${GITHUB_RUN_NUMBER} versionName=${VERSION_NAME}"
            for f in out/*.apk; do
              echo "cs-apk: file=$(basename "$f") sha256=$(sha256sum "$f" | cut -d' ' -f1) size=$(stat -c%s "$f")"
            done
            echo "<!-- cs-update-end -->"
          } > out/release-body.md
          cat out/release-body.md

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish rolling latest build (main branch)
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ env.APP_NAME }} ${{ env.VERSION_NAME }} - latest build
          prerelease: true
          body_path: out/release-body.md
          files: |
            out/app-debug-full.apk
            out/app-debug-full.md5
            out/app-debug-noruntime.apk
            out/app-debug-noruntime.md5
            out/CS-Launcher-Plus-release.apk
            out/CS-Launcher-Plus-release.md5
          fail_on_unmatched_files: false

      - name: Release tagged build (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ github.ref_name }}
          body_path: out/release-body.md
          files: |
            out/app-debug-full.apk
            out/app-debug-full.md5
            out/app-debug-noruntime.apk
            out/app-debug-noruntime.md5
            out/CS-Launcher-Plus-release.apk
            out/CS-Launcher-Plus-release.md5
          fail_on_unmatched_files: false
